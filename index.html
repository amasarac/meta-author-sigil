<!DOCTYPE html>
<html lang="en" data-constellation="wi-literal-name-e8">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta-Author-Sigil — wI' Nested Name Constellation</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

  <style>
    :root {
      --panel-bg: rgba(5, 5, 14, 0.78);
      --panel-border: rgba(180, 210, 255, 0.22);
      --text: #f7f7ff;
      --muted: #aab;
      --gold: #ffd700;
      --cyan: #00ffff;
      --violet: #8a2be2;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #080713 0%, #000 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #render-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .label {
      color: #f7f7ff;
      font-size: 12px;
      line-height: 1.1;
      text-shadow: 0 0 5px #000, 0 0 10px #000;
      pointer-events: none;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 2px 6px;
      backdrop-filter: blur(2px);
      opacity: 0.95;
      transition: opacity 0.25s ease;
    }

    body.labels-hidden .label {
      opacity: 0;
    }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      max-width: min(370px, calc(100vw - 24px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.45), 0 0 28px rgba(138, 43, 226, 0.16);
      border-radius: 14px;
      padding: 12px;
      backdrop-filter: blur(10px);
    }

    #ui h1 {
      margin: 0 0 2px;
      font-size: 16px;
      letter-spacing: 0.03em;
      color: var(--gold);
    }

    #ui .subtitle {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 7px 0;
    }

    button, select, input {
      font: inherit;
      font-size: 12px;
      color: var(--text);
      background: rgba(24, 24, 40, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 7px 9px;
      outline: none;
    }

    button {
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:hover, select:hover, input:focus {
      background: rgba(45, 45, 75, 0.92);
      border-color: rgba(255, 215, 0, 0.42);
    }

    button:active {
      transform: scale(0.98);
    }

    input {
      min-width: 190px;
      flex: 1 1 auto;
    }

    #stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 9px;
    }

    .stat {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.22);
      padding: 6px;
      border-radius: 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: var(--cyan);
      font-size: 14px;
    }

    .stat span {
      color: var(--muted);
      font-size: 10px;
    }

    #legend {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      max-width: min(420px, calc(100vw - 24px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px 12px;
      backdrop-filter: blur(10px);
      font-size: 12px;
    }

    #legend .family {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 3px 8px 3px 0;
      color: #ccd;
      white-space: nowrap;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
      display: inline-block;
    }

    #detailsPanel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(430px, 92vw);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 20;
      box-sizing: border-box;
      padding: 18px;
      background: rgba(8, 8, 18, 0.94);
      border-left: 1px solid rgba(255,255,255,0.12);
      box-shadow: -10px 0 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      overflow-y: auto;
    }

    #detailsPanel.visible {
      transform: translateX(0);
    }

    #closeDetails {
      position: absolute;
      right: 12px;
      top: 12px;
    }

    #detailsTitle {
      margin: 20px 42px 6px 0;
      color: var(--gold);
      font-size: 22px;
    }

    #detailsMeta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    #detailsContent {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #e8e8ff;
    }

    #status {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      max-width: min(460px, calc(100vw - 24px));
      background: rgba(0,0,0,0.62);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      color: #ddd;
      font-size: 12px;
      line-height: 1.4;
      backdrop-filter: blur(8px);
    }

    #operatorSeal {
      margin-top: 8px;
      color: var(--gold);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      #ui {
        max-width: calc(100vw - 24px);
      }
      #legend, #status {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="render-container"></div>

  <section id="ui" aria-label="wI constellation controls">
    <h1>wI' Nested Name Constellation</h1>
    <p class="subtitle">Every literal supplied name is a visible star. Shells are families. Clusters are gravity wells. E8 is the ghost-lattice, not the cage.</p>

    <div class="row">
      <button data-mode="nested">Nested Shells</button>
      <button data-mode="e8">E8 Projection</button>
      <button data-mode="cluster">Cluster Braid</button>
    </div>

    <div class="row">
      <button id="toggleE8">Toggle E8 Ghost</button>
      <button id="toggleLinks">Toggle Links</button>
      <button id="toggleLabels">Toggle Labels</button>
      <button id="resetCamera">Reset View</button>
    </div>

    <div class="row">
      <select id="familyFilter" title="Filter constellation family">
        <option value="all">All families</option>
      </select>
      <input id="searchBox" type="search" placeholder="Find a name, cluster, or family…" />
    </div>

    <div class="row">
      <button id="startAudio">Activate Harmonic Engine</button>
      <button id="focusWI">Focus wI'</button>
    </div>

    <div id="stats">
      <div class="stat"><strong id="nodeCount">0</strong><span>nodes</span></div>
      <div class="stat"><strong id="familyCount">0</strong><span>families</span></div>
      <div class="stat"><strong id="clusterCount">0</strong><span>clusters</span></div>
    </div>

    <div id="operatorSeal">+ → ≠ &nbsp; addition without equivalence</div>
  </section>

  <section id="legend" aria-label="family legend"></section>

  <aside id="detailsPanel" aria-live="polite">
    <button id="closeDetails">Close</button>
    <h2 id="detailsTitle">Node</h2>
    <div id="detailsMeta"></div>
    <pre id="detailsContent"></pre>
  </aside>

  <div id="status">Loading wI' literal name-token constellation…</div>

  <script>
    const CONFIG = {
      manifestPath: "jsonld/manifest.json",
      latticePath: "jsonld/e8-layout-map.json",
      shellBase: 35,
      shellStep: 58,
      e8Scale: 470,
      clusterScale: 72,
      linkOpacity: 0.22,
      familyOrder: [
        "wi-center",
        "orphic-first-light",
        "dionysian-rupture-rebirth",
        "solar-imperial-mystery",
        "chthonic-animal-human-threshold",
        "cadis-mythos-continuity",
        "holographic-name-litany"
      ],
      familyLabels: {
        "wi-center": "wI' center",
        "orphic-first-light": "Orphic First-Light",
        "dionysian-rupture-rebirth": "Dionysian Rupture/Rebirth",
        "solar-imperial-mystery": "Solar Imperial Mystery",
        "chthonic-animal-human-threshold": "Chthonic Threshold",
        "cadis-mythos-continuity": "CADIS/MythOS",
        "holographic-name-litany": "Holographic Litany"
      },
      familyColors: {
        "wi-center": "#FFD700",
        "orphic-first-light": "#FFFACD",
        "dionysian-rupture-rebirth": "#C71585",
        "solar-imperial-mystery": "#FFA500",
        "chthonic-animal-human-threshold": "#556B2F",
        "cadis-mythos-continuity": "#8A2BE2",
        "holographic-name-litany": "#E6E6FA"
      }
    };

    let scene, camera, renderer, labelRenderer;
    let constellationGroup, linkGroup, ringGroup, e8Group;
    let raycaster, mouse;
    let stars = [];
    let loadedPersonas = [];
    let personaByStableId = new Map();
    let mode = "nested";
    let showE8 = true;
    let showLinks = true;
    let audioReady = false;
    let synth = null;
    let animationFrame = null;

    init();
    buildConstellationFromManifest();

    function init() {
      const container = document.getElementById("render-container");

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000006, 0.0018);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
      camera.position.set(0, 160, 760);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      labelRenderer = new THREE.CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = "fixed";
      labelRenderer.domElement.style.top = "0";
      labelRenderer.domElement.style.left = "0";
      labelRenderer.domElement.style.pointerEvents = "none";
      labelRenderer.domElement.style.zIndex = "2";
      container.appendChild(labelRenderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.72);
      scene.add(ambient);

      const key = new THREE.PointLight(0x8a2be2, 1.35, 1800);
      key.position.set(260, 380, 420);
      scene.add(key);

      const gold = new THREE.PointLight(0xffd700, 1.1, 1500);
      gold.position.set(-440, -180, 280);
      scene.add(gold);

      constellationGroup = new THREE.Group();
      linkGroup = new THREE.Group();
      ringGroup = new THREE.Group();
      e8Group = new THREE.Group();

      scene.add(e8Group);
      scene.add(ringGroup);
      scene.add(linkGroup);
      scene.add(constellationGroup);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      renderer.domElement.addEventListener("click", onCanvasClick);
      renderer.domElement.addEventListener("mousemove", onPointerMove);
      window.addEventListener("resize", onResize);

      setupUI();
      animate();
    }

    function setupUI() {
      document.querySelectorAll("button[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          mode = btn.dataset.mode;
          layoutStars(true);
          updateStatus(`Mode: ${buttonText(btn)}.`);
        });
      });

      document.getElementById("toggleE8").addEventListener("click", () => {
        showE8 = !showE8;
        e8Group.visible = showE8;
        updateStatus(showE8 ? "E8 ghost-lattice visible." : "E8 ghost-lattice hidden.");
      });

      document.getElementById("toggleLinks").addEventListener("click", () => {
        showLinks = !showLinks;
        linkGroup.visible = showLinks;
        updateStatus(showLinks ? "Resonance links visible." : "Resonance links hidden.");
      });

      document.getElementById("toggleLabels").addEventListener("click", () => {
        document.body.classList.toggle("labels-hidden");
      });

      document.getElementById("resetCamera").addEventListener("click", resetCamera);
      document.getElementById("focusWI").addEventListener("click", focusWI);

      document.getElementById("familyFilter").addEventListener("change", applyFilters);
      document.getElementById("searchBox").addEventListener("input", applyFilters);

      document.getElementById("startAudio").addEventListener("click", async () => {
        try {
          if (typeof Tone !== "undefined") {
            await Tone.start();
            synth = new Tone.FMSynth({
              harmonicity: 1.4,
              modulationIndex: 9,
              envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.7 }
            }).toDestination();
            audioReady = true;
            updateStatus("Harmonic engine online. Click a star to hear its thread.");
          } else {
            updateStatus("Tone.js did not load, but the visual constellation is online.");
          }
        } catch (error) {
          console.warn(error);
          updateStatus("Audio activation failed, but the visual constellation remains online.");
        }
      });

      document.getElementById("closeDetails").addEventListener("click", () => {
        document.getElementById("detailsPanel").classList.remove("visible");
      });
    }

    function buttonText(btn) {
      return (btn.textContent || "").trim();
    }

    async function buildConstellationFromManifest() {
      try {
        updateStatus("Reading jsonld/manifest.json…");
        const manifest = await fetchJson(CONFIG.manifestPath);
        const files = Array.isArray(manifest.personas) ? manifest.personas : [];
        if (!files.length) throw new Error("Manifest contains no personas array entries.");

        updateStatus(`Loading ${files.length} literal name nodes…`);
        const results = await Promise.allSettled(files.map(file => fetchJson(`jsonld/${file}`).then(data => ({ file, data }))));

        const failures = results.filter(r => r.status === "rejected");
        loadedPersonas = results
          .filter(r => r.status === "fulfilled")
          .map(r => ({ ...r.value.data, __file: r.value.file }));

        if (!loadedPersonas.length) throw new Error("No persona files loaded successfully.");

        buildFamilyFilter(loadedPersonas);
        buildLegend(loadedPersonas);
        buildRings();
        buildE8GhostLattice();
        buildStars(loadedPersonas);
        buildLinks();
        updateStats();

        if (failures.length) {
          updateStatus(`Constellation online with ${loadedPersonas.length} nodes. ${failures.length} file(s) failed to load; see console.`);
          console.warn("Failed persona loads:", failures);
        } else {
          updateStatus(`Constellation online: ${loadedPersonas.length} visible stars nested around wI'.`);
        }
      } catch (error) {
        console.error(error);
        updateStatus(`Failed to build constellation: ${error.message || error}`);
      }
    }

    async function fetchJson(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${path}: HTTP ${response.status}`);
      }
      return response.json();
    }

    function stableIdFor(persona) {
      return (persona.__file || persona.id || persona.name || Math.random().toString(36))
        .toString()
        .split("/")
        .pop()
        .replace(/\.jsonld$/i, "")
        .replace(/\.json$/i, "")
        .toLowerCase()
        .replace(/[^\w-]+/g, "_");
    }

    function displayLabel(persona) {
      return (persona.display && persona.display.label) || persona.literalToken || persona.name || "Unnamed";
    }

    function familyOf(persona) {
      return persona.constellationFamily || (persona.display && persona.display.family) || "holographic-name-litany";
    }

    function clusterOf(persona) {
      return persona.canonicalCluster || (persona.display && persona.display.cluster) || "unclustered";
    }

    function colorOf(persona) {
      try {
        return new THREE.Color(persona.color || CONFIG.familyColors[familyOf(persona)] || "#eeeeff");
      } catch {
        return new THREE.Color("#eeeeff");
      }
    }

    function buildStars(personas) {
      clearGroup(constellationGroup);
      stars = [];
      personaByStableId.clear();

      personas.forEach((persona, index) => {
        const shell = Number(persona.display && persona.display.shell) || 1;
        const isCenter = familyOf(persona) === "wi-center" || shell === 0;
        const geometry = new THREE.IcosahedronGeometry(isCenter ? 17 : 8.5, isCenter ? 2 : 1);
        const material = new THREE.MeshStandardMaterial({
          color: colorOf(persona),
          roughness: isCenter ? 0.22 : 0.45,
          metalness: 0.82,
          wireframe: !isCenter,
          emissive: colorOf(persona),
          emissiveIntensity: isCenter ? 0.32 : 0.06
        });

        const mesh = new THREE.Mesh(geometry, material);
        const stableId = stableIdFor(persona);
        personaByStableId.set(stableId, persona);

        mesh.userData = {
          stableId,
          persona,
          originalIndex: index,
          shell,
          family: familyOf(persona),
          cluster: clusterOf(persona),
          note: noteFor(index, shell)
        };

        mesh.position.copy(positionFor(persona, index, personas.length));
        constellationGroup.add(mesh);
        stars.push(mesh);

        const labelDiv = document.createElement("div");
        labelDiv.className = "label";
        labelDiv.textContent = displayLabel(persona);
        const label = new THREE.CSS2DObject(labelDiv);
        label.position.set(0, isCenter ? 24 : 14, 0);
        mesh.add(label);
      });

      layoutStars(false);
    }

    function positionFor(persona, index, total) {
      const shell = Number(persona.display && persona.display.shell) || 1;
      if (shell === 0 || familyOf(persona) === "wi-center") {
        return new THREE.Vector3(0, 0, 0);
      }

      const radius = Number(persona.display && persona.display.radius) || (CONFIG.shellBase + shell * CONFIG.shellStep);
      const family = familyOf(persona);
      const familyIndex = Math.max(0, CONFIG.familyOrder.indexOf(family));
      const familyCount = Math.max(1, CONFIG.familyOrder.length - 1);
      const familyAngle = ((familyIndex - 1) / familyCount) * Math.PI * 2;

      const unit = getProjectedUnit(persona, index, total);
      const clusterHash = hashString(clusterOf(persona));
      const clusterAngle = ((clusterHash % 360) / 360) * Math.PI * 2;
      const orbit = Number(persona.display && persona.display.orbitIndex) || index;
      const golden = Math.PI * (3 - Math.sqrt(5));

      if (mode === "e8") {
        return new THREE.Vector3(unit.x, unit.y, unit.z).multiplyScalar(radius * 1.55);
      }

      if (mode === "cluster") {
        const clusterRadius = radius + ((clusterHash % 7) - 3) * 12;
        const localAngle = clusterAngle + orbit * golden * 0.18;
        const y = unit.y * radius * 0.55 + Math.sin(orbit * 0.21) * 24;
        return new THREE.Vector3(
          Math.cos(localAngle) * clusterRadius + unit.x * CONFIG.clusterScale,
          y,
          Math.sin(localAngle) * clusterRadius + unit.z * CONFIG.clusterScale
        );
      }

      // nested shell default: major families get their own orbital sectors, E8 unit adds depth.
      const localAngle = familyAngle + orbit * golden * 0.085;
      const sectorX = Math.cos(familyAngle) * radius;
      const sectorZ = Math.sin(familyAngle) * radius;
      return new THREE.Vector3(
        sectorX + Math.cos(localAngle) * radius * 0.22 + unit.x * radius * 0.34,
        unit.y * radius * 0.72,
        sectorZ + Math.sin(localAngle) * radius * 0.22 + unit.z * radius * 0.34
      );
    }

    function getProjectedUnit(persona, index, total) {
      const unit = persona.projectedPosition && Array.isArray(persona.projectedPosition.unit)
        ? persona.projectedPosition.unit
        : null;

      if (unit && unit.length >= 3 && unit.every(Number.isFinite)) {
        return new THREE.Vector3(unit[0], unit[1], unit[2]).normalize();
      }

      const phi = Math.acos(-1 + (2 * index) / Math.max(2, total));
      const theta = Math.sqrt(total * Math.PI) * phi;
      return new THREE.Vector3().setFromSphericalCoords(1, phi, theta).normalize();
    }

    function layoutStars(animate) {
      stars.forEach((star, index) => {
        const target = positionFor(star.userData.persona, index, stars.length);
        if (animate) {
          star.userData.targetPosition = target;
        } else {
          star.position.copy(target);
        }
      });
      rebuildLinksSoon();
    }

    let relinkTimer = null;
    function rebuildLinksSoon() {
      if (relinkTimer) clearTimeout(relinkTimer);
      relinkTimer = setTimeout(buildLinks, 260);
    }

    function buildLinks() {
      clearGroup(linkGroup);
      if (!stars.length) return;

      const points = [];
      const center = stars.find(s => s.userData.family === "wi-center");

      if (center) {
        stars.forEach(star => {
          if (star === center) return;
          points.push(center.position.clone(), star.position.clone());
        });
      }

      const byCluster = new Map();
      stars.forEach(star => {
        const c = star.userData.cluster || "unclustered";
        if (!byCluster.has(c)) byCluster.set(c, []);
        byCluster.get(c).push(star);
      });

      byCluster.forEach(group => {
        if (group.length > 1) {
          for (let i = 1; i < group.length; i++) {
            points.push(group[i - 1].position.clone(), group[i].position.clone());
          }
        }
      });

      if (!points.length) return;
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({
        color: 0x8899ff,
        transparent: true,
        opacity: CONFIG.linkOpacity
      });
      const lines = new THREE.LineSegments(geometry, material);
      linkGroup.add(lines);
      linkGroup.visible = showLinks;
    }

    function buildRings() {
      clearGroup(ringGroup);
      for (let shell = 1; shell <= 6; shell++) {
        const radius = CONFIG.shellBase + shell * CONFIG.shellStep;
        const geometry = new THREE.TorusGeometry(radius, 0.38, 8, 180);
        const color = new THREE.Color(Object.values(CONFIG.familyColors)[shell] || "#8888ff");
        const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.13 });
        const ring = new THREE.Mesh(geometry, material);
        ring.rotation.x = Math.PI / 2;
        ring.userData.shell = shell;
        ringGroup.add(ring);
      }
    }

    function buildE8GhostLattice() {
      clearGroup(e8Group);
      const roots = generateE8Roots();
      const positions = [];
      roots.forEach(root => {
        const unit = project8To3(root);
        positions.push(unit.x * CONFIG.e8Scale, unit.y * CONFIG.e8Scale, unit.z * CONFIG.e8Scale);
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0x4466ff,
        size: 2.2,
        transparent: true,
        opacity: 0.18,
        depthWrite: false
      });

      const points = new THREE.Points(geometry, material);
      e8Group.add(points);
      e8Group.visible = showE8;
    }

    function generateE8Roots() {
      const roots = [];
      for (let i = 0; i < 8; i++) {
        for (let j = i + 1; j < 8; j++) {
          for (const si of [1, -1]) {
            for (const sj of [1, -1]) {
              const v = Array(8).fill(0);
              v[i] = si;
              v[j] = sj;
              roots.push(v);
            }
          }
        }
      }

      function signsRecursive(prefix) {
        if (prefix.length === 8) {
          const minus = prefix.filter(x => x < 0).length;
          if (minus % 2 === 0) roots.push(prefix.slice());
          return;
        }
        signsRecursive(prefix.concat(0.5));
        signsRecursive(prefix.concat(-0.5));
      }
      signsRecursive([]);
      return roots;
    }

    function project8To3(v) {
      const xyz = [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        let sum = 0;
        for (let i = 0; i < 8; i++) {
          const weight = Math.cos((i + 1) * (k + 1) * Math.PI / 9) + Math.sin((i + 1) * (k + 2) * Math.PI / 11);
          sum += weight * v[i];
        }
        xyz[k] = sum;
      }
      const vec = new THREE.Vector3(xyz[0], xyz[1], xyz[2]);
      return vec.lengthSq() > 0 ? vec.normalize() : new THREE.Vector3(1, 0, 0);
    }

    function buildFamilyFilter(personas) {
      const select = document.getElementById("familyFilter");
      const families = Array.from(new Set(personas.map(familyOf))).sort((a, b) => {
        return CONFIG.familyOrder.indexOf(a) - CONFIG.familyOrder.indexOf(b);
      });

      families.forEach(family => {
        if (family === "wi-center") return;
        const option = document.createElement("option");
        option.value = family;
        option.textContent = CONFIG.familyLabels[family] || family;
        select.appendChild(option);
      });
    }

    function buildLegend(personas) {
      const legend = document.getElementById("legend");
      const families = Array.from(new Set(personas.map(familyOf))).sort((a, b) => {
        return CONFIG.familyOrder.indexOf(a) - CONFIG.familyOrder.indexOf(b);
      });

      legend.innerHTML = families.map(family => {
        const color = CONFIG.familyColors[family] || "#eeeeff";
        const label = CONFIG.familyLabels[family] || family;
        const count = personas.filter(p => familyOf(p) === family).length;
        return `<span class="family"><span class="swatch" style="background:${color}; color:${color}"></span>${escapeHtml(label)} (${count})</span>`;
      }).join("");
    }

    function updateStats() {
      const families = new Set(loadedPersonas.map(familyOf));
      const clusters = new Set(loadedPersonas.map(clusterOf));
      document.getElementById("nodeCount").textContent = loadedPersonas.length;
      document.getElementById("familyCount").textContent = families.size;
      document.getElementById("clusterCount").textContent = clusters.size;
    }

    function applyFilters() {
      const family = document.getElementById("familyFilter").value;
      const query = document.getElementById("searchBox").value.trim().toLowerCase();

      stars.forEach(star => {
        const p = star.userData.persona;
        const matchesFamily = family === "all" || familyOf(p) === family || familyOf(p) === "wi-center";
        const haystack = [
          p.name,
          p.literalToken,
          displayLabel(p),
          familyOf(p),
          clusterOf(p),
          p.description,
          Array.isArray(p.alignments) ? p.alignments.join(" ") : ""
        ].join(" ").toLowerCase();
        const matchesSearch = !query || haystack.includes(query);
        const visible = matchesFamily && matchesSearch;
        star.visible = visible;
        star.children.forEach(child => { child.visible = visible; });
      });

      buildLinks();
    }

    function onCanvasClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(stars.filter(s => s.visible), false);
      if (intersects.length) {
        const star = intersects[0].object;
        showDetails(star.userData.persona);
        playNode(star);
      }
    }

    function onPointerMove(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hit = raycaster.intersectObjects(stars.filter(s => s.visible), false).length > 0;
      renderer.domElement.style.cursor = hit ? "pointer" : "grab";
    }

    function showDetails(persona) {
      document.getElementById("detailsTitle").textContent = displayLabel(persona);
      document.getElementById("detailsMeta").innerHTML = `
        <strong>Family:</strong> ${escapeHtml(CONFIG.familyLabels[familyOf(persona)] || familyOf(persona))}<br>
        <strong>Cluster:</strong> ${escapeHtml(clusterOf(persona))}<br>
        <strong>Source:</strong> ${escapeHtml(persona.sourceList || "unknown")}<br>
        <strong>Operator:</strong> ${escapeHtml(persona.operator || "+ → ≠")}
      `;
      document.getElementById("detailsContent").textContent = JSON.stringify(persona, null, 2);
      document.getElementById("detailsPanel").classList.add("visible");
    }

    function playNode(star) {
      if (!audioReady || !synth) return;
      try {
        synth.triggerAttackRelease(star.userData.note, "8n");
      } catch (error) {
        console.warn(error);
      }
    }

    function noteFor(index, shell) {
      const notes = ["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5", "A5", "C6"];
      return notes[(index + shell * 2) % notes.length];
    }

    function focusWI() {
      const center = stars.find(s => s.userData.family === "wi-center");
      if (!center) return;
      center.material.emissiveIntensity = 0.8;
      setTimeout(() => { if (center.material) center.material.emissiveIntensity = 0.32; }, 900);
      camera.position.set(0, 120, 520);
      updateStatus("Focused on wI'.");
    }

    function resetCamera() {
      camera.position.set(0, 160, 760);
      camera.lookAt(0, 0, 0);
      updateStatus("Camera reset.");
    }

    function animate() {
      animationFrame = requestAnimationFrame(animate);

      const t = performance.now() * 0.00018;
      constellationGroup.rotation.y = t;
      linkGroup.rotation.y = t;
      ringGroup.rotation.y = t;
      e8Group.rotation.y = -t * 0.45;
      e8Group.rotation.x = Math.sin(t * 0.7) * 0.08;

      stars.forEach(star => {
        if (star.userData.targetPosition) {
          star.position.lerp(star.userData.targetPosition, 0.08);
          if (star.position.distanceTo(star.userData.targetPosition) < 0.3) {
            star.position.copy(star.userData.targetPosition);
            star.userData.targetPosition = null;
          }
        }
        const shell = star.userData.shell || 1;
        star.rotation.x += 0.002 + shell * 0.00015;
        star.rotation.y += 0.003 + shell * 0.00018;
      });

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    function clearGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        disposeObject(child);
      }
    }

    function disposeObject(obj) {
      obj.traverse?.(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => m.dispose && m.dispose());
          } else if (child.material.dispose) {
            child.material.dispose();
          }
        }
        if (child.element && child.element.parentNode) {
          child.element.parentNode.removeChild(child.element);
        }
      });
    }

    function updateStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function hashString(value) {
      let hash = 0;
      const s = String(value || "");
      for (let i = 0; i < s.length; i++) {
        hash = ((hash << 5) - hash) + s.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
