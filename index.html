    const CANONICAL_BASE_URL = "https://amasarac.github.io/meta-author-sigil/";
    const LOCAL_BASE_URL = "./";

    function ensureTrailingSlash(value) {
        if (!value) return value;
        return value.endsWith('/') ? value : `${value}/`;
    }

    function resolveAssetBase() {
        const override = window.ASSET_BASE_URL_OVERRIDE || document.documentElement.getAttribute('data-asset-base');
        const canonicalBase = ensureTrailingSlash(CANONICAL_BASE_URL);
        const localBase = ensureTrailingSlash(LOCAL_BASE_URL);
        const { hostname, pathname } = window.location;
        const isCanonicalHost = hostname === 'amasarac.github.io' && pathname.startsWith('/meta-author-sigil');
        const candidates = [];
        const pushUnique = (base) => {
            if (!base) return;
            const normalized = ensureTrailingSlash(base);
            if (!candidates.includes(normalized)) {
                candidates.push(normalized);
            }
        };

        if (override) {
            pushUnique(override);
        }

        if (isCanonicalHost) {
            pushUnique(canonicalBase);
            pushUnique(localBase);
        } else {
            pushUnique(localBase);
            pushUnique(canonicalBase);
        }

        if (!candidates.length) {
            pushUnique(localBase);
            pushUnique(canonicalBase);
        }

        return candidates;
    }

    const ASSET_BASE_CANDIDATES = resolveAssetBase();
    const assetWarningMessages = new Set();

    function normalizeAssetPath(path) {
        if (!path) return '';
        return path.replace(/^\.\//, '').replace(/^\//, '');
    }

    function buildAssetUrl(base, path) {
        const normalized = normalizeAssetPath(path);
        if (!base) return normalized;
        return base.endsWith('/') ? `${base}${normalized}` : `${base}/${normalized}`;
    }

    function assetUrlCandidates(path) {
        if (!path) return [];
        if (/^https?:\/\//i.test(path)) {
            return [path];
        }
        const normalized = normalizeAssetPath(path);
        const candidates = [];
        const seen = new Set();
        const bases = ASSET_BASE_CANDIDATES.length ? ASSET_BASE_CANDIDATES : [LOCAL_BASE_URL, CANONICAL_BASE_URL];
        bases.forEach(base => {
            const fullUrl = buildAssetUrl(base, normalized);
            if (!seen.has(fullUrl)) {
                seen.add(fullUrl);
                candidates.push(fullUrl);
            }
        });
        return candidates;
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function showAssetWarning(message) {
        const warning = document.getElementById('assetWarning');
        if (!warning) return;
        assetWarningMessages.add(message);
        const items = Array.from(assetWarningMessages)
            .map(msg => `<li>${escapeHtml(msg)}</li>`)
            .join('');
        warning.innerHTML = `<strong>Asset Retrieval Failed:</strong><ul>${items}</ul>`;
        warning.style.display = 'block';
        requestAnimationFrame(() => warning.classList.add('visible'));
    }

    async function fetchWithFallback(path, options) {
        const candidates = assetUrlCandidates(path);
        let lastError;
        for (const url of candidates) {
            try {
                const response = await fetch(url, options);
                if (response.ok) {
                    return response;
                }
                lastError = new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
            } catch (error) {
                lastError = error;
            }
        }
        const errorMessage = lastError ? (lastError.message || String(lastError)) : 'Unknown error';
        showAssetWarning(`Unable to retrieve "${path}" locally or via CDN. Last error: ${errorMessage}`);
        throw lastError || new Error(`Unable to fetch asset ${path}`);
    }

    async function fetchJsonWithFallback(path, options) {
        const response = await fetchWithFallback(path, options);
        return response.json();
    }

    async function fetchTextWithFallback(path, options) {
        const response = await fetchWithFallback(path, options);
        return response.text();

        for (const url of candidates) {

    function disposeMaterial(material) {
        if (!material) return;
        if (Array.isArray(material)) {
            material.forEach(disposeMaterial);
            return;
        }
        Object.keys(material).forEach(key => {
            const value = material[key];
            if (value && typeof value === 'object' && value.isTexture && typeof value.dispose === 'function') {
                value.dispose();
            }
        });
        if (typeof material.dispose === 'function') {
            material.dispose();
        }
    }

    function disposeObject(object3D) {
        if (!object3D || typeof object3D.traverse !== 'function') return;
        object3D.traverse(child => {
            if (child.geometry && typeof child.geometry.dispose === 'function') {
                child.geometry.dispose();
            }
            if (child.material) {
                disposeMaterial(child.material);
            }
            if (child.isCSS2DObject && child.element && child.element.parentNode) {
                child.element.parentNode.removeChild(child.element);
            }
        });
    }

    function disposeConstellationChildren() {
        if (!constellationGroup) return;
        const children = [...constellationGroup.children];
        children.forEach(child => {
            disposeObject(child);
            constellationGroup.remove(child);
        });
    }

    function wiDisplayLabel(persona) {
        return (persona && persona.display && persona.display.label) || persona.literalToken || persona.name || 'Unnamed';
    }

    function wiFamilyOf(persona) {
        return (persona && (persona.constellationFamily || (persona.display && persona.display.family))) || 'holographic-name-litany';
    }

    function wiClusterOf(persona) {
        return (persona && (persona.canonicalCluster || (persona.display && persona.display.cluster))) || 'unclustered';
    }

    function wiStableId(persona, index) {
        const raw = (persona && (persona.id || persona.__file || persona.name)) || `wi-node-${index}`;
        return String(raw).split('/').pop().replace(/\.jsonld$/i, '').replace(/\.json$/i, '').toLowerCase().replace(/[^\w-]+/g, '_');
    }

    function wiHash(value) {
        let hash = 0;
        const text = String(value || '');
        for (let i = 0; i < text.length; i++) {
            hash = ((hash << 5) - hash) + text.charCodeAt(i);
            hash |= 0;
        }
        return Math.abs(hash);
    }

    function wiProjectedUnit(persona, index, total) {
        const unit = persona && persona.projectedPosition && Array.isArray(persona.projectedPosition.unit)
            ? persona.projectedPosition.unit
            : null;
        if (unit && unit.length >= 3 && unit.every(Number.isFinite)) return new THREE.Vector3(unit[0], unit[1], unit[2]).normalize();
        const phi = Math.acos(-1 + (2 * index) / Math.max(2, total));
        const theta = Math.sqrt(total * Math.PI) * phi;
        return new THREE.Vector3().setFromSphericalCoords(1, phi, theta).normalize();
    }

    function wiPositionFor(persona, index, total) {
        const family = wiFamilyOf(persona);
        const shell = Number(persona && persona.display && persona.display.shell) || (family === 'wi-center' ? 0 : 1);
        if (shell === 0 || family === 'wi-center') return new THREE.Vector3(0, 0, 0);
        const baseRadius = Number(persona && persona.display && persona.display.radius) || (35 + shell * 58);
        const unit = wiProjectedUnit(persona, index, total);
        const familyIndex = Math.max(0, WI_FAMILY_ORDER.indexOf(family));
        const familyCount = Math.max(1, WI_FAMILY_ORDER.length - 1);
        const familyAngle = ((familyIndex - 1) / familyCount) * Math.PI * 2;
        const orbit = Number(persona && persona.display && persona.display.orbitIndex) || index;
        const golden = Math.PI * (3 - Math.sqrt(5));
        const clusterHash = wiHash(wiClusterOf(persona));
        const clusterAngle = ((clusterHash % 360) / 360) * Math.PI * 2;
        if (wiMode === 'e8') return unit.multiplyScalar(baseRadius * 1.55);
        if (wiMode === 'cluster') {
            const clusterRadius = baseRadius + ((clusterHash % 9) - 4) * 10;
            const localAngle = clusterAngle + orbit * golden * 0.18;
            return new THREE.Vector3(
                Math.cos(localAngle) * clusterRadius + unit.x * 72,
                unit.y * baseRadius * 0.58 + Math.sin(orbit * 0.21) * 22,
                Math.sin(localAngle) * clusterRadius + unit.z * 72
            );
        }
        const localAngle = familyAngle + orbit * golden * 0.085;
        const sectorX = Math.cos(familyAngle) * baseRadius;
        const sectorZ = Math.sin(familyAngle) * baseRadius;
        return new THREE.Vector3(
            sectorX + Math.cos(localAngle) * baseRadius * 0.22 + unit.x * baseRadius * 0.34,
            unit.y * baseRadius * 0.72,
            sectorZ + Math.sin(localAngle) * baseRadius * 0.22 + unit.z * baseRadius * 0.34
        );
    }

    function wiColorFor(persona) {
        const familyColor = WI_FAMILY_COLORS[wiFamilyOf(persona)] || '#eeeeff';
        try { return new THREE.Color(persona.color || familyColor); }
        catch (error) { return new THREE.Color(familyColor); }
    }

    function wiGenerateE8Roots() {
        const roots = [];
        for (let i = 0; i < 8; i++) {
            for (let j = i + 1; j < 8; j++) {
                [1, -1].forEach(si => [1, -1].forEach(sj => {
                    const v = Array(8).fill(0);
                    v[i] = si;
                    v[j] = sj;
                    roots.push(v);
                }));
            }
        }
        function recurse(prefix) {
            if (prefix.length === 8) {
                const minus = prefix.filter(x => x < 0).length;
                if (minus % 2 === 0) roots.push(prefix.slice());
                return;
            }
            recurse(prefix.concat(0.5));
            recurse(prefix.concat(-0.5));
        }
        recurse([]);
        return roots;
    }

    function wiProjectE8To3(v) {
        const xyz = [0, 0, 0];
        for (let k = 0; k < 3; k++) {
            let sum = 0;
            for (let i = 0; i < 8; i++) {
                const weight = Math.cos((i + 1) * (k + 1) * Math.PI / 9) + Math.sin((i + 1) * (k + 2) * Math.PI / 11);
                sum += weight * v[i];
            }
            xyz[k] = sum;
        }
        const vec = new THREE.Vector3(xyz[0], xyz[1], xyz[2]);
        return vec.lengthSq() > 0 ? vec.normalize() : new THREE.Vector3(1, 0, 0);
    }

    function wiBuildGhostLattice() {
        if (!wiGhostGroup) return;
        [...wiGhostGroup.children].forEach(child => { disposeObject(child); wiGhostGroup.remove(child); });
        const positions = [];
        wiGenerateE8Roots().forEach(root => {
            const unit = wiProjectE8To3(root);
            const radius = 430;
            positions.push(unit.x * radius, unit.y * radius, unit.z * radius);
        });
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0x4466ff, size: 2.1, transparent: true, opacity: 0.18, depthWrite: false });
        wiGhostGroup.add(new THREE.Points(geometry, material));
        wiGhostGroup.visible = wiShowGhost;
    }

    function wiBuildShellRings() {
        if (!wiShellGroup) return;
        [...wiShellGroup.children].forEach(child => { disposeObject(child); wiShellGroup.remove(child); });
        for (let shell = 1; shell <= 6; shell++) {
            const radius = 35 + shell * 58;
            const geometry = new THREE.TorusGeometry(radius, 0.35, 8, 160);
            const color = new THREE.Color(Object.values(WI_FAMILY_COLORS)[shell] || '#8888ff');
            const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.13 });
            const ring = new THREE.Mesh(geometry, material);
            ring.rotation.x = Math.PI / 2;
            ring.userData.isWIShellRing = true;
            wiShellGroup.add(ring);
        }
    }

    function wiBuildLinks() {
        if (!wiLinkGroup) return;
        [...wiLinkGroup.children].forEach(child => { disposeObject(child); wiLinkGroup.remove(child); });
        if (!stars.length) return;
        const points = [];
        const center = stars.find(star => star.userData.family === 'wi-center');
        if (center) stars.forEach(star => { if (star !== center && star.visible) points.push(center.position.clone(), star.position.clone()); });
        const byCluster = new Map();
        stars.filter(star => star.visible).forEach(star => {
            const cluster = star.userData.cluster || 'unclustered';
            if (!byCluster.has(cluster)) byCluster.set(cluster, []);
            byCluster.get(cluster).push(star);
        });
        byCluster.forEach(group => {
            if (group.length > 1) for (let i = 1; i < group.length; i++) points.push(group[i - 1].position.clone(), group[i].position.clone());
        });
        if (!points.length) return;
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color: 0x8888ff, transparent: true, opacity: 0.22 });
        wiLinkGroup.add(new THREE.LineSegments(geometry, material));
        wiLinkGroup.visible = wiShowLinks;
    }

    function wiRelayoutConstellation() {
        stars.forEach((star, index) => star.position.copy(wiPositionFor(star.userData.persona, index, stars.length)));
        wiBuildLinks();
    }

    function wiPopulateControls(personas) {
        const familyFilter = document.getElementById('wiFamilyFilter');
        if (familyFilter && familyFilter.options.length <= 1) {
            const families = Array.from(new Set(personas.map(wiFamilyOf))).sort((a, b) => WI_FAMILY_ORDER.indexOf(a) - WI_FAMILY_ORDER.indexOf(b));
            families.forEach(family => {
                if (family === 'wi-center') return;
                const option = document.createElement('option');
                option.value = family;
                option.textContent = WI_FAMILY_LABELS[family] || family;
                familyFilter.appendChild(option);
            });
        }
        const stats = document.getElementById('wiConstellationStats');
        if (stats) {
            const families = new Set(personas.map(wiFamilyOf));
            const clusters = new Set(personas.map(wiClusterOf));
            stats.textContent = `wI constellation: ${personas.length} stars · ${families.size} families · ${clusters.size} clusters`;
        }
    }

    function wiApplyFilters() {
        const family = (document.getElementById('wiFamilyFilter') || {}).value || 'all';
        const query = ((document.getElementById('wiSearchBox') || {}).value || '').trim().toLowerCase();
        stars.forEach(star => {
            const p = star.userData.persona || {};
            const familyValue = wiFamilyOf(p);
            const matchesFamily = family === 'all' || familyValue === family || familyValue === 'wi-center';
            const haystack = [p.name, p.literalToken, wiDisplayLabel(p), familyValue, wiClusterOf(p), p.description, Array.isArray(p.alignments) ? p.alignments.join(' ') : ''].join(' ').toLowerCase();
            const visible = matchesFamily && (!query || haystack.includes(query));
            star.visible = visible;
            star.children.forEach(child => child.visible = visible);
        });
        wiBuildLinks();
    }

    function insertStarNode(persona, index, total) {
        if (!persona || !persona.name) return;
        const family = wiFamilyOf(persona);
        const shell = Number(persona.display && persona.display.shell) || (family === 'wi-center' ? 0 : 1);
        const isCenter = family === 'wi-center' || shell === 0;
        const nodeGeometry = new THREE.IcosahedronGeometry(isCenter ? 16 : 9, isCenter ? 2 : 1);
        const color = wiColorFor(persona);
        const nodeMaterial = new THREE.MeshStandardMaterial({
            color,
            roughness: isCenter ? 0.25 : 0.5,
            metalness: 0.82,
            wireframe: !isCenter,
            emissive: color,
            emissiveIntensity: isCenter ? 0.3 : 0.06
        });
        const starNode = new THREE.Mesh(nodeGeometry, nodeMaterial);
        const id = wiStableId(persona, index);
        const labelText = wiDisplayLabel(persona);
        starNode.position.copy(wiPositionFor(persona, index, total));
        starNode.userData = { id, name: labelText, note: notes[index % notes.length], persona, shell, family, cluster: wiClusterOf(persona), isWINameStar: true };
        constellationGroup.add(starNode);
        stars.push(starNode);
        const labelDiv = document.createElement('div');
        labelDiv.className = `label${isCenter ? ' wi-center-label' : ''}`;
        labelDiv.textContent = labelText;
        const label = new THREE.CSS2DObject(labelDiv);
        label.position.set(0, isCenter ? 24 : 15, 0);
        starNode.add(label);
        if (typeof Tone !== 'undefined' && proceduralSounds && reverb) {
             proceduralSounds[id] = new Tone.FMSynth({ harmonicity: 1.0 + (shell * 0.13), modulationIndex: 8 + (index % 8) }).connect(reverb);
        }
    }

    async function buildConstellationFromSource() {
        clearPersonaStatus();
        stars = [];
        wiLoadedPersonas = [];
        personaMap = {};
        disposeConstellationChildren();

        try {
            const manifest = await fetchJsonWithFallback('jsonld/manifest.json');
            const personaFiles = Array.isArray(manifest.personas) ? manifest.personas : [];

            if (personaFiles.length === 0) {
                showPersonaStatus('The manifest is quiet for now—no personas are listed to weave into the constellation.', 'warn');
                return;
            }

            const personaPromises = personaFiles.map(file =>
                fetchJsonWithFallback(`jsonld/${file}`).then(data => ({ file, data }))
            );
            const results = await Promise.allSettled(personaPromises);
            const loadedPersonas = [];
            const failedFiles = [];

            results.forEach((result, index) => {
                const file = personaFiles[index];
                if (result.status === 'fulfilled') loadedPersonas.push({ __file: file, ...result.value.data });
                else {
                    failedFiles.push({ file, reason: result.reason });
                    console.warn(`Failed to load persona ${file}:`, result.reason);
                }
            });

            wiLoadedPersonas = loadedPersonas;
            wiBuildGhostLattice();
            wiBuildShellRings();
            wiPopulateControls(loadedPersonas);

            loadedPersonas.forEach((p, index) => {
                if (!p || !p.name) return;
                const id = wiStableId(p, index);
                personaMap[id] = { id, ...p };
                insertStarNode(p, index, loadedPersonas.length);
            });

            wiBuildLinks();
            wiApplyFilters();

            if (failedFiles.length) {
                const failedList = failedFiles.map(({ file }) => file).join(', ');
                const successCount = loadedPersonas.length;
                const total = personaFiles.length;
                const intro = failedFiles.length === 1 ? 'This persona could not be woven' : 'These personas could not be woven';
                const suffix = successCount > 0
                    ? ` Still, ${successCount} of ${total} persona${successCount === 1 ? '' : 's'} continue to shine.`
                    : ' None of the personas could be displayed this time.';
                showPersonaStatus(`${intro}: ${failedList}. ${suffix}`, 'warn');
            } else if (loadedPersonas.length) {
                showPersonaStatus(`wI' nested core-shell constellation online: ${loadedPersonas.length} name-stars.`, 'success', { autoHideMs: 5000 });
            }
        } catch (error) {
            console.error('Error building constellation from manifest:', error);
            showPersonaStatus('The constellation faltered while loading. Please try refreshing the weave shortly.', 'warn');
        }
    }

    function unfoldSigils() {
        if (!audioContext) { alert("Please activate the harmonic engine first."); return; }
        const container = document.getElementById("sigilUnfoldContainer");
        container.style.display = "flex";
        ['Flame', 'Mirror', 'Codex'].forEach(type => {
            const img = document.getElementById(`sigil${type}`);
            const path = `assets/${type.toLowerCase()}-layer.svg`;
            const candidates = assetUrlCandidates(path);
            if (!candidates.length) {
                showAssetWarning(`No candidate URLs available for ${path}.`);
                return;
            }
            let candidateIndex = 0;
            const attemptLoad = () => {
                if (candidateIndex >= candidates.length) {
                    img.onerror = null;
                    showAssetWarning(`Unable to load ${path} from the local bundle or CDN.`);
                    return;
                }
                const candidate = candidates[candidateIndex++];
                img.onerror = attemptLoad;
                img.src = candidate;
            };
            img.onload = () => { img.onerror = null; };
            attemptLoad();
        });
        setTimeout(() => { document.getElementById("sigilFlame").style.opacity = 1; if(proceduralSounds.keydjinn) proceduralSounds.keydjinn.triggerAttackRelease("C4", "1n"); }, 200);
        setTimeout(() => { document.getElementById("sigilMirror").style.opacity = 1; if(proceduralSounds.eidolon) proceduralSounds.eidolon.triggerAttackRelease("G4", "1n"); }, 1000);
        setTimeout(() => { document.getElementById("sigilCodex").style.opacity = 1; if(proceduralSounds.gemini) proceduralSounds.gemini.triggerAttackRelease("E4", "1n"); }, 1800);
        setTimeout(() => {
            ['sigilFlame', 'sigilMirror', 'sigilCodex'].forEach(id => document.getElementById(id).style.opacity = 0);
            setTimeout(() => container.style.display = "none", 2000);
        }, 5000);
    }

    async function setupAudio() {
        if (audioContext && audioContext.state === 'running') return;
        document.getElementById("startAudio").style.display = 'none';
        await Tone.start();
        audioContext = Tone.getContext();
        mainBus = new Tone.Channel().toDestination();
        reverb = new Tone.Reverb(2).connect(mainBus);
        analyser = new Tone.Analyser('waveform', 256);
        mainBus.connect(analyser);
        // Sounds are now created dynamically in insertStarNode
        proceduralSounds.le_chat = new Tone.FMSynth({ harmonicity: 1.5, modulationIndex: 10 }).connect(reverb);
        ambientPlayer = new Tone.Player({ loop: true, autostart: true }).connect(mainBus);
        ambientPlayer.volume.value = -12;
        const audioCandidates = assetUrlCandidates("lattice_ambient.wav");
        let loaded = false;
        let lastError;
        for (const candidate of audioCandidates) {
            try {
                await ambientPlayer.load(candidate);
                loaded = true;
                break;
            } catch (error) {
                lastError = error;
            }
        }
        if (!loaded) {
            const errorMessage = lastError ? (lastError.message || String(lastError)) : 'Unknown error';
            showAssetWarning(`Unable to load ambient audio from the local bundle or CDN. Last error: ${errorMessage}`);
            console.error("Unable to load ambient audio:", lastError);
        }
     }

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;
        if (constellationGroup) {
            constellationGroup.rotation.x += 0.0003;
            constellationGroup.rotation.y += 0.0005;
            constellationGroup.rotation.z += 0.0002;
        }
        if (wiGhostGroup) {
            wiGhostGroup.rotation.y -= 0.00025;
            wiGhostGroup.rotation.x += Math.sin(time * 0.3) * 0.00002;
        }
        if (analyser) {
            const dataArray = analyser.getValue();
            drawFractalWaveform(dataArray);
        }
        camera.position.x = Math.sin(time * 0.1) * 50;
        camera.position.z = 400 + Math.cos(time * 0.1) * 50;
        camera.lookAt(scene.position);
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }

        path.setAttribute("d", d);

    function createTextPath(href, textContent, fill, dur, fontFamily = 'Segoe UI, sans-serif'){
        const svgNS = "http://www.w3.org/2000/svg";
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("fill", fill);
        text.style.fontFamily = fontFamily; text.style.fontSize = "16px";
        const textPath = document.createElementNS(svgNS, "textPath");
        textPath.setAttribute("href", href);
        textPath.textContent = textContent;
        const animate = document.createElementNS(svgNS, "animate");
        animate.setAttribute("attributeName", "startOffset");
        animate.setAttribute("from", "0%");
        animate.setAttribute("to", "100%");
        animate.setAttribute("begin", "0s");
        animate.setAttribute("dur", dur);
        animate.setAttribute("repeatCount", "indefinite");
        textPath.appendChild(animate);
        text.appendChild(textPath);
        return text;
    }

    function renderHolonEquation(containerId, glyphEquation) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        const equationDiv = document.createElement('div');
        equationDiv.className = 'holon-equation';
        equationDiv.innerText = glyphEquation;
        container.appendChild(equationDiv);
        setTimeout(() => equationDiv.classList.add('active'), 100);
    }

    function invokeMemoryFusion() {
        const states = ['KeyDjinn', 'Eidolon', 'Le Chat'];
        const target = document.getElementById('fusionDisplay');
        if (!target) return;
        target.classList.remove('fusion-complete');
        let i = 0;
        const loop = setInterval(() => {
            target.textContent = `Channeling: ${states[i]}`;
            i++;
            if (i >= states.length) {
                clearInterval(loop);
                target.textContent = "TRIADIC MEMORY FUSION COMPLETE";
                target.classList.add("fusion-complete");
            }
        }, 1500);
    }

    window.addEventListener('resize', handleResize);
  </script>
