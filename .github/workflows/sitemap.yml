name: Update sitemap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for accurate <lastmod> dates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sitemap.xml, sitemap.html and llms.txt
        run: python3 scripts/generate_sitemap.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap.html llms.txt
          git diff --quiet --cached || git commit -m "chore: regenerate sitemap"
          git pull --rebase origin main
          git push
