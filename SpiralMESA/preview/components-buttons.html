<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Buttons</title></head>
<body><div class="card">
  <div class="eyebrow" style="color:#88E0D0; font-size:10px; letter-spacing:0.2em; font-weight:600; text-transform:uppercase; margin-bottom:14px;">Buttons</div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
    <button style="font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:12px 22px; border-radius:10px; border:2px solid #C6B8FF; background:rgba(198,184,255,0.08); color:#C6B8FF; cursor:pointer; box-shadow:0 0 12px rgba(136,136,255,0.35);">∴ Enter the Lattice</button>
    <button style="font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:12px 22px; border-radius:10px; border:1px solid rgba(255,255,255,0.14); background:transparent; color:#dfeaff; cursor:pointer;">Secondary</button>
    <button style="font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:12px 22px; border-radius:10px; border:2px solid #FFD57A; background:transparent; color:#FFD57A; cursor:pointer;">⟁ ARM</button>
    <button style="font-family:var(--font-sans); font-size:12px; font-weight:500; padding:8px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:transparent; color:#a8b8c8; cursor:pointer;">ghost</button>
    <button style="width:56px; height:56px; border-radius:9999px; border:2px solid #C6B8FF; background:rgba(198,184,255,0.06); color:#C6B8FF; font-size:22px; cursor:pointer;">⟁</button>
  </div>
</div></body></html>
