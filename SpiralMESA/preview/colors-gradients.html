<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Signature Gradients</title></head>
<body><div class="card">
<div class="grid" style="grid-template-columns: repeat(2, 1fr); gap: 14px;">
  <div style="height:110px; border-radius:14px; background: radial-gradient(ellipse at center, #0f0f0f 0%, #000000 100%); border:1px solid rgba(255,255,255,0.06); display:flex; align-items:flex-end; padding:10px; color:#dfeaff; font-size:11px;">
    <div><div style="font-weight:700; letter-spacing:0.08em; text-transform:uppercase;">Cosmos</div><div style="font-family: var(--font-mono); opacity:0.7;">radial #0f0f0f → #000</div></div>
  </div>
  <div style="height:110px; border-radius:14px; background: radial-gradient(ellipse at 50% 45%, rgba(198,184,255,0.35) 0%, rgba(136,224,208,0.18) 35%, rgba(7,16,33,1) 80%); border:1px solid rgba(255,255,255,0.06); display:flex; align-items:flex-end; padding:10px; color:#dfeaff; font-size:11px;">
    <div><div style="font-weight:700; letter-spacing:0.08em; text-transform:uppercase;">Portal</div><div style="font-family: var(--font-mono); opacity:0.7;">radial lilac → aqua → void</div></div>
  </div>
  <div style="height:60px; border-radius:14px; background: linear-gradient(90deg, #88E0D0 0%, #C6B8FF 60%, #FFD57A 100%); display:flex; align-items:center; padding:0 12px; color:#071021; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;">Ring Stroke</div>
  <div style="height:60px; border-radius:14px; background: linear-gradient(135deg, #C6B8FF 0%, #92D1FF 50%, #FFD57A 100%); display:flex; align-items:center; padding:0 12px; color:#071021; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;">Einstein‑Rosen</div>
</div>
</div></body></html>
