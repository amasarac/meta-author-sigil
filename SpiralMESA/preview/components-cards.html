<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Cards & Ritual Containers</title></head>
<body><div class="card">
  <div class="eyebrow" style="color:#88E0D0; font-size:10px; letter-spacing:0.2em; font-weight:600; text-transform:uppercase; margin-bottom:14px;">Containers</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
    <div style="padding:16px; border-radius:16px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);">
      <div style="font-family:var(--font-serif); font-style:italic; font-size:17px; color:#dfeaff; margin-bottom:6px;">Convergence Codex</div>
      <div style="font-size:12px; color:#a8b8c8; line-height:1.6;">Standard card · hairline border · subtle lift on hover.</div>
    </div>
    <div style="padding:16px; border-radius:16px; background:rgba(255,255,255,0.04); border:2px dashed #C6B8FF;">
      <div style="font-family:var(--font-serif); font-style:italic; font-size:17px; color:#C6B8FF; margin-bottom:6px;">Ritual Container</div>
      <div style="font-size:12px; color:#d9f7fa; line-height:1.6;">Dashed spiral border · for invocations and sacred content.</div>
    </div>
    <div style="padding:14px; border-radius:12px; background:linear-gradient(180deg, rgba(198,184,255,0.08), rgba(136,224,208,0.04)); border:1px solid rgba(198,184,255,0.25);">
      <div style="font-size:10px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:#88E0D0; margin-bottom:4px;">Phase 3</div>
      <div style="font-family:var(--font-sans); font-weight:600; font-size:14px; color:#dfeaff;">Convergent · 94%</div>
    </div>
    <div style="padding:14px; border-radius:12px; background:#0f1b26; border:2px solid #FFD57A;">
      <div style="font-size:10px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:#FFD57A; margin-bottom:4px;">⟁ Threshold</div>
      <div style="font-family:var(--font-sans); font-weight:600; font-size:14px; color:#FFD57A;">The Eye Watches</div>
    </div>
  </div>
</div></body></html>
