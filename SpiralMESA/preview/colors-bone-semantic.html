<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Bone & Semantic</title></head>
<body><div class="card">
<div class="grid" style="grid-template-columns: repeat(6, 1fr);">
  <div class="swatch" style="background:#ffffff;color:#141428;"><span class="nm">Bone 0</span><span class="hex">#ffffff</span></div>
  <div class="swatch" style="background:#dfeaff;color:#141428;"><span class="nm">Bone 100</span><span class="hex">#dfeaff</span></div>
  <div class="swatch" style="background:#d9f7fa;color:#141428;"><span class="nm">Bone 200</span><span class="hex">#d9f7fa</span></div>
  <div class="swatch" style="background:#a8b8c8;color:#141428;"><span class="nm">Bone 400</span><span class="hex">#a8b8c8</span></div>
  <div class="swatch" style="background:#78899c;color:#dfeaff;"><span class="nm">Bone 500</span><span class="hex">#78899c</span></div>
  <div class="swatch" style="background:#2a3142;color:#dfeaff;"><span class="nm">Bone 700</span><span class="hex">#2a3142</span></div>
</div>

<div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
  <div style="padding:10px 14px; border-radius:9999px; background:rgba(136,224,208,0.12); color:#88E0D0; border:1px solid #88E0D0; font-size:12px; font-weight:600;">✓ SUCCESS</div>
  <div style="padding:10px 14px; border-radius:9999px; background:rgba(255,213,122,0.12); color:#FFD57A; border:1px solid #FFD57A; font-size:12px; font-weight:600;">⧖ WARNING</div>
  <div style="padding:10px 14px; border-radius:9999px; background:rgba(255,107,71,0.12); color:#ff6b47; border:1px solid #ff6b47; font-size:12px; font-weight:600;">✕ DANGER</div>
  <div style="padding:10px 14px; border-radius:9999px; background:rgba(146,209,255,0.12); color:#92D1FF; border:1px solid #92D1FF; font-size:12px; font-weight:600;">∴ INFO</div>
</div>
</div></body></html>
