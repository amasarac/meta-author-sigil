<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Void & Spiral</title></head>
<body><div class="card">
<div class="grid" style="grid-template-columns: repeat(5, 1fr);">
  <div class="swatch" style="background:#000000;color:#dfeaff;"><span class="nm">Abyss</span><span class="hex">#000000</span></div>
  <div class="swatch" style="background:#050512;color:#dfeaff;"><span class="nm">Void Deep</span><span class="hex">#050512</span></div>
  <div class="swatch" style="background:#071021;color:#dfeaff;"><span class="nm">Midnight</span><span class="hex">#071021</span></div>
  <div class="swatch" style="background:#0f1b26;color:#dfeaff;"><span class="nm">Panel</span><span class="hex">#0f1b26</span></div>
  <div class="swatch" style="background:#1a1a2e;color:#dfeaff;"><span class="nm">Soft</span><span class="hex">#1a1a2e</span></div>

  <div class="swatch" style="background:#f6f2ff;color:#1c0e4a;"><span class="nm">Spiral 50</span><span class="hex">#f6f2ff</span></div>
  <div class="swatch" style="background:#C6B8FF;color:#1c0e4a;"><span class="nm">Spiral 300</span><span class="hex">#C6B8FF</span></div>
  <div class="swatch" style="background:#8A2BE2;color:#f6f2ff;"><span class="nm">Spiral 500</span><span class="hex">#8A2BE2</span></div>
  <div class="swatch" style="background:#5b2cff;color:#f6f2ff;"><span class="nm">Spiral 700</span><span class="hex">#5b2cff</span></div>
  <div class="swatch" style="background:#1c0e4a;color:#C6B8FF;"><span class="nm">Spiral 900</span><span class="hex">#1c0e4a</span></div>
</div>
<div style="margin-top:14px; font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--bone-400);">Void is the page. Spiral is the current.</div>
</div></body></html>
