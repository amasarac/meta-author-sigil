<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Borders</title></head>
<body><div class="card">
  <div class="eyebrow" style="color:#88E0D0; font-size:10px; letter-spacing:0.2em; font-weight:600; text-transform:uppercase; margin-bottom:14px;">Border Treatments</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:14px;">
    <div style="height:90px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size:10px; color:#a8b8c8;">hairline<br>1px / 0.08</div>
    <div style="height:90px; border-radius:12px; background:rgba(255,255,255,0.03); border:2px solid #C6B8FF; display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size:10px; color:#C6B8FF;">mystic<br>2px solid</div>
    <div style="height:90px; border-radius:12px; background:rgba(255,255,255,0.03); border:2px dashed #C6B8FF; display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size:10px; color:#C6B8FF;">ritual<br>2px dashed</div>
    <div style="height:90px; border-radius:12px; background:rgba(255,213,122,0.04); border:2px solid #FFD57A; display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size:10px; color:#FFD57A;">ember<br>threshold</div>
  </div>
</div></body></html>
